<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<title>Tiers V4: Tabletop</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%233a78d8'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23fff'/%3E%3C/svg%3E">
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/three-addons/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="fx-layer"></div>

<div id="hud" class="hidden">
  <header id="top">
    <div class="top-l">
      <div class="crest" id="crest"></div>
      <div><div class="t-k">Round</div><div class="t-v" id="t-round">1</div></div>
      <div class="phase" id="t-phase">Planning</div>
    </div>
    <div class="top-r">
      <div class="eco" id="t-sup"></div>
      <div class="cp" id="t-cp" title="Command points: squads you can give exact orders to this round"></div>
      <button class="ib" id="b-help" title="How to play">?</button>
      <button class="ib" id="b-menu" title="Menu">≡</button>
    </div>
  </header>

  <div id="hintbar" class="glass hidden"></div>
  <div id="toast"></div>
  <div id="tape" class="hidden"></div>

  <section id="dock" class="glass hidden"></section>
  <section id="info" class="glass hidden"></section>

  <section id="buildbar" class="glass hidden"></section>
  <footer id="bottom">
    <div id="squadbar"></div>
    <div class="ready-col">
      <div class="rc-row"><button id="b-build" class="rehearse buildbtn" title="Build and train (B)"><span>Build</span></button><button id="b-rehearse" class="rehearse" title="Preview your plan with enemies standing still">Rehearse</button></div>
      <button id="b-ready" class="ready">Ready <span>▸</span></button>
    </div>
  </footer>

  <footer id="playbar" class="glass hidden">
    <div class="pb-row">
      <button class="ib" id="pb-play" title="Play / pause">❚❚</button>
      <button class="ib sm" id="pb-speed" title="Speed">1×</button>
      <div id="scrub"><div id="scrub-sections"></div><div id="scrub-blocks"></div><div id="scrub-head"></div></div>
      <button id="pb-next" class="ready sm">Next round ▸</button>
    </div>
    <div id="pb-caption"></div>
  </footer>
  <aside id="log" class="glass hidden"></aside>
</div>

<div id="menu" class="overlay">
  <div class="card menu-card">
    <div class="brand">
      <div class="brand-mark"><span></span><span></span></div>
      <h1>TIERS</h1>
      <p>Tabletop battles · simultaneous orders · speed tiers</p>
      <p class="tag">V4 preview · milestone 3</p>
    </div>
    <div class="factions">
      <button class="fac kingdom" id="m-kingdom"><b>Kingdom</b><small>Knights, shieldwalls and crossbows</small></button>
      <button class="fac undead" id="m-undead"><b>Undead Legion</b><small>Skeletons, wraiths and necromancy</small></button>
    </div>
    <button class="opt" id="m-anim"><span><b>Mini animation: <em class="anim-v">Posable arms</em></b><small>Posable arms swing their weapons; solid statues lunge like minis moved by hand</small></span></button>
    <button class="opt" id="m-lens"><span><b>Miniature lens</b><small>Tilt-shift blur, like a macro photo</small></span><i class="sw"></i></button>
    <p class="fine">Pick your army to play against the AI. Online play arrives in a later milestone.<br><a href="../">Back to V3</a></p>
  </div>
</div>

<div id="help" class="overlay hidden">
  <div class="card help-card">
    <div class="help-head"><h2>How to play</h2><button class="ib" id="help-close">✕</button></div>
    <div class="help-body" id="help-body"></div>
  </div>
</div>

<div id="opts" class="overlay hidden">
  <div class="card opts-card">
    <div class="help-head"><h2>Menu</h2><button class="ib" id="o-close">✕</button></div>
    <button class="opt" id="o-lens"><span><b>Miniature lens</b><small>Soft tilt-shift blur at the top and bottom of the view, like a macro photo of a tabletop</small></span><i class="sw"></i></button>
    <button class="opt" id="o-anim"><span><b>Mini animation: <em class="anim-v">Posable arms</em></b><small>Posable arms swing their weapons; solid statues are one casting and lunge like minis moved by hand</small></span></button>
    <button class="opt" id="o-quit"><span><b>Quit to main menu</b><small>Ends this battle</small></span></button>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card"><h2 id="over-title">Victory</h2><p id="over-msg"></p><button class="ready" onclick="location.reload()">Play again</button></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
